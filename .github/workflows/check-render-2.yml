name: Check new Render extractor
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-render-2.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check health and extraction response
        shell: bash
        run: |
          echo "Health endpoint:"
          curl -sS -L --max-time 30 -w '\nHTTP %{http_code}\n' https://chord-extractor-2.onrender.com/ | head -c 1000
          echo
          echo "YouTube extraction request:"
          curl -sS --max-time 110 -X POST -H 'Content-Type: application/json' --data '{"url":"https://www.youtube.com/watch?v=5mNwj616_Qc"}' -D /tmp/render-headers -o /tmp/render-body https://chord-extractor-2.onrender.com/extract || true
          grep -Ei '^HTTP/|^content-type:|^retry-after:' /tmp/render-headers || true
          if grep -qi 'audio/mpeg' /tmp/render-headers; then echo "AUDIO RESPONSE (body hidden)"; else head -c 1500 /tmp/render-body; fi
          echo
