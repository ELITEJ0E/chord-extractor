name: Backend checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check backend syntax
        run: node --check server.js && node --check extractorPolicy.js
      - name: Run backend tests
        run: node --test tests/*.test.js
