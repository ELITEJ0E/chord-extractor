name: YouTube metadata diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/youtube-metadata-diagnostic.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install current yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"
      - name: Test one YouTube video metadata request (no audio download)
        shell: bash
        run: |
          echo "yt-dlp version: $(yt-dlp --version)"
          echo "Deno version: $(deno --version | head -1)"
          set +e
          timeout 90 yt-dlp --no-config --no-playlist --skip-download --dump-single-json --js-runtimes deno --remote-components ejs:npm "https://www.youtube.com/watch?v=5mNwj616_Qc" > /tmp/yt-probe.json 2> /tmp/yt-probe-errors.txt
          status=$?
          set -e
          echo "Metadata extraction exit status: $status"
          if [ -s /tmp/yt-probe-errors.txt ]; then
            tail -n 35 /tmp/yt-probe-errors.txt
          fi
          if [ "$status" -eq 0 ]; then
            python -c 'import json; d=json.load(open("/tmp/yt-probe.json")); print("SUCCESS: video id =", d.get("id"), "; duration =", d.get("duration"), "; audio formats =", len([f for f in d.get("formats",[]) if f.get("acodec") not in (None, "none")]))'
          fi
          exit "$status"
