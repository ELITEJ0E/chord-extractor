name: Docker build check
on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - ".github/workflows/docker-build-check.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build extractor container
        run: docker build --progress=plain -t chord-extractor:check .
